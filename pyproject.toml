[project]
name = "support-copilot"
version = "0.1.0"
description = "DataPilot enterprise support workbench (demonstration data only)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4",
  "pydantic-settings==2.9.1", "sqlalchemy==2.0.40", "alembic==1.15.2",
  "psycopg[binary]==3.2.9", "pgvector==0.4.1", "httpx==0.28.1",
  "jinja2==3.1.6", "python-multipart==0.0.20", "jieba==0.42.1",
  "rank-bm25==0.2.2", "packaging==25.0", "defusedxml==0.7.1",
]

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "playwright==1.52.0", "ruff==0.11.9"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
